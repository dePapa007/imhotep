services:
  db:
    image: postgres:16
    container_name: soccer-academy-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: soccer_academy
    ports:
      - "5432:5432"
    volumes:
      - soccer_academy_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d soccer_academy"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  soccer_academy_pgdata:
